name: Build Android APK and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias palmod -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass palmod123 -keypass palmod123 -dname "CN=PalMod Mobile"
            echo "KEYSTORE_PASSWORD=palmod123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=palmod" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=palmod123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Locate project
        run: |
          if [ -f project.zip ]; then unzip -q -o project.zip -d _project; fi
          S=$(find . -name settings.gradle.kts -not -path './.git/*' -not -path './_project/.git/*' | head -n 1)
          if [ -z "$S" ]; then
            echo "::error::settings.gradle.kts not found. Upload the CONTENTS of project.zip (unzipped), not the zip file itself."
            ls -R | head -50
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" PalModMobile-1.0.${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalModMobile-apk
          path: PalModMobile-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PalMod Mobile 1.0.${{ github.run_number }}
          files: PalModMobile-*.apk
          body: |
            Android build of PalMod. Install the APK (allow "install unknown apps").
            Back up your ROM files before saving edits.
